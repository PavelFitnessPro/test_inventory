services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: inventory_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASS: secretpassword
      DB_NAME: inventory_db
    # ВАЖНО: Мы убрали отсюда ports. Приложение больше не торчит наружу напрямую!

  nginx:
    image: nginx:alpine
    ports:
      - "80:80" # Nginx открыт всему миру
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Подкидываем ему наши настройки
    depends_on:
      - app # Nginx ждет, пока включится приложение

volumes:
  pgdata:

